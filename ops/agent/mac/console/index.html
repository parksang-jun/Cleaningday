<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>싹싹 클린 운영센터</title>
<link rel="icon" href="/icon.png">
<style>
:root {
  --bg: #f4f6f8; --panel: #ffffff; --line: #e3e8ee; --fg: #17212b; --muted: #66748a; --soft: #eef2f6;
  --side: #10233a; --side-fg: #c9d6e6; --side-active: #1d3a5c; --brand: #12a594; --brand-ink: #ffffff;
  --ok: #138a4c; --ok-bg: #e5f6ec; --warn: #a15c00; --warn-bg: #fff3dc; --bad: #c0362c; --bad-bg: #fde9e7; --info: #2563c9; --info-bg: #e7efff;
  --shadow: 0 1px 2px rgba(16,35,58,.06), 0 4px 14px rgba(16,35,58,.05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --panel: #17202a; --line: #263241; --fg: #e6edf5; --muted: #93a3b8; --soft: #1d2834;
  --side: #0a1118; --side-fg: #a9b8ca; --side-active: #182736; --brand: #2cc4b0; --brand-ink: #062a25;
  --ok: #4fd18b; --ok-bg: #12301f; --warn: #f0b252; --warn-bg: #33270f; --bad: #ff7b6e; --bad-bg: #3a1714; --info: #7fa8ff; --info-bg: #17254a;
  --shadow: none; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; }
button { font: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
aside { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: #fff; }
.brand img { width: 34px; height: 34px; border-radius: 9px; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand small { color: var(--side-fg); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; color: var(--side-fg); text-align: left; }
.nav:hover { background: var(--side-active); color: #fff; }
.nav.on { background: var(--side-active); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--brand); }
.nav .ic { width: 18px; text-align: center; opacity: .9; }
.nav .badge { margin-left: auto; background: var(--brand); color: var(--brand-ink); font-size: 11px; padding: 0 7px; border-radius: 99px; font-weight: 700; }
.side-foot { margin-top: auto; font-size: 11px; padding: 8px; line-height: 1.6; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: #2fd27f; } .dot.warn { background: #f3b23c; } .dot.bad { background: #ff6b5e; } .dot.run { background: #5aa0ff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
main { padding: 22px 28px 40px; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.top h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
.top .sub { color: var(--muted); font-size: 12.5px; }
.top .sp { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 7px 12px; border-radius: 8px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: transparent; font-weight: 600; }
.btn.pri:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.card h2 .sp { flex: 1; }
.card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.kpi .lab { color: var(--muted); font-size: 12px; }
.kpi .val { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .hint { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--panel); }
.banner.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.banner.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.banner.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.banner b { color: inherit; }
.banner .sp { flex: 1; }
.routines { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 14px; }
textarea, select, input[type=text] { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 96px; resize: vertical; }
textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.form { display: grid; gap: 8px; }
.form .row { display: flex; gap: 8px; align-items: center; } .form .row select { width: auto; flex: 0 0 auto; }
.fb-text { white-space: pre-wrap; word-break: break-word; }
.diag { border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--line); background: var(--soft); }
.diag.fatal { background: var(--bad-bg); border-color: transparent; } .diag.warn { background: var(--warn-bg); border-color: transparent; } .diag.ok { background: var(--ok-bg); border-color: transparent; }
.diag h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.diag dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; } .diag dt { color: var(--muted); white-space: nowrap; } .diag dd { margin: 0; }
.diag .btnrow { margin-top: 10px; }
.ap { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.ap > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 10px; align-items: center; }
.ap > summary::-webkit-details-marker { display: none; }
.ap > summary .ttl { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; }
.ap > summary .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ap > summary::after { content: '▾'; color: var(--muted); } .ap[open] > summary::after { content: '▴'; }
.ap .body { padding: 0 16px 16px; display: grid; gap: 14px; }
.ap .sec h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.ap .sec p { margin: 0; }
.ap ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.ap .facts { display: flex; gap: 8px; flex-wrap: wrap; }
.ap .act { background: var(--soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.ap .act h4 { margin: 0; font-size: 13px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; }
.opt .t { flex: 1; min-width: 0; } .opt .t b { display: block; } .opt .t span { color: var(--muted); font-size: 12.5px; }
.opt.rec { border-color: var(--brand); }
.ap.decided { opacity: .92; } .ap.decided > summary .ttl { font-weight: 600; }
.pr-body { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: var(--soft); border-radius: 8px; padding: 10px 12px; max-height: 220px; overflow: auto; }
h2.grp { font-size: 14px; margin: 22px 0 10px; display: flex; gap: 8px; align-items: center; } h2.grp small { color: var(--muted); font-weight: 400; }
.chipbtn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; }
.chipbtn:hover { border-color: var(--brand); }
.cmd { border-top: 1px solid var(--line); padding: 14px 0; display: grid; gap: 8px; } .cmd:first-child { border-top: 0; padding-top: 0; }
.cmd .q { display: flex; gap: 10px; align-items: flex-start; } .cmd .q .t { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; font-weight: 600; }
.cmd .a { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; } .cmd .a .doc { font-size: 13.5px; max-width: none; } .cmd .a .doc > :first-child { margin-top: 0; } .cmd .a .doc > :last-child { margin-bottom: 0; }
.cmd .m { color: var(--muted); font-size: 12px; }
.strip { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); margin: -4px 2px 14px; }
.strip b { color: var(--fg); font-weight: 600; } .strip a, .linkish { color: var(--info); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; }
.rt { display: flex; flex-direction: column; gap: 8px; }
.rt .head { display: flex; align-items: center; gap: 8px; }
.rt .code { width: 26px; height: 26px; border-radius: 7px; background: var(--soft); display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--muted); }
.rt .name { font-weight: 700; }
.rt .desc { color: var(--muted); font-size: 12.5px; min-height: 2.6em; }
.rt dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 12.5px; }
.rt dt { color: var(--muted); } .rt dd { margin: 0; }
.rt .acts { display: flex; gap: 6px; margin-top: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .t { flex: 1; min-width: 0; }
.list .m { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; padding: 14px 0; text-align: center; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--soft); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.due td { background: var(--warn-bg); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; }
.pick { cursor: pointer; border-radius: 8px; padding: 8px 10px !important; margin: 0 -10px; border-top: 0 !important; }
.pick:hover { background: var(--soft); }
.pick.on { background: var(--info-bg); }
.doc { font-size: 14px; line-height: 1.7; max-width: 76ch; }
.doc h1 { font-size: 19px; } .doc h2 { font-size: 16px; margin-top: 1.4em; } .doc h3 { font-size: 14.5px; }
.doc code { background: var(--soft); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.doc pre { background: var(--soft); padding: 12px; border-radius: 8px; overflow-x: auto; }
.doc table { margin: 10px 0; } .doc a { color: var(--info); }
pre.log { background: #0c1219; color: #cfe0f2; padding: 14px; border-radius: 10px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 68vh; overflow: auto; margin: 0; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.check .t { flex: 1; } .check .m { color: var(--muted); font-size: 12px; word-break: break-all; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; right: 20px; bottom: 20px; max-width: 420px; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.2); white-space: pre-wrap; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 9; }
.toast.on { opacity: 1; transform: none; }
.muted { color: var(--muted); }
.tag-auto { color: var(--info); } .tag-ok { color: var(--warn); }
@media (max-width: 980px) { .kpis, .routines { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols2, .split { grid-template-columns: 1fr; } }
@media (max-width: 680px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } .brand, .side-foot { display: none; } .nav { width: auto; } main { padding: 16px; } .kpis, .routines { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><img src="/icon.png" alt="" onerror="this.style.display='none'"><div><b>싹싹 클린</b><small>운영센터</small></div></div>
    <button class="nav on" data-page="home"><span class="ic">▦</span>대시보드</button>
    <button class="nav" data-page="command"><span class="ic">➤</span>명령<span class="badge" id="b-command" hidden></span></button>
    <button class="nav" data-page="approve"><span class="ic">✓</span>결재함<span class="badge" id="b-approve" hidden></span></button>
    <button class="nav" data-page="improve"><span class="ic">↗</span>제품 개선<span class="badge" id="b-improve" hidden></span></button>
    <button class="nav" data-page="sponsors"><span class="ic">◎</span>광고주 영업</button>
    <button class="nav" data-page="money"><span class="ic">₩</span>정산</button>
    <button class="nav" data-page="reports"><span class="ic">▤</span>보고서</button>
    <button class="nav" data-page="runs"><span class="ic">↻</span>실행 기록</button>
    <button class="nav" data-page="settings"><span class="ic">⚙</span>설정</button>
    <div class="side-foot" id="side-foot"><span class="dot"></span>연결 중…</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let C = { cloud: [], local: [], synced: null };
let S = null, D = null, page = 'home', sel = { report: null, log: null, ap: null };
try { page = localStorage.getItem('sc-page') || 'home'; } catch {}

async function api(p, body) {
  const r = await fetch(p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-SC': '1' }, body: JSON.stringify(body) } : {});
  return r.json();
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 4200); }
async function act(p, body, btn) {
  if (btn) btn.disabled = true;
  try { const r = await api(p, body); toast(r.msg || (r.ok ? '완료' : '실패')); await refresh(true); return r; }
  catch { toast('운영센터 서버와 연결이 끊겼습니다. 앱을 다시 열어 주세요.'); }
  finally { if (btn) btn.disabled = false; }
}

const fmtDate = (iso, withTime = true) => { if (!iso) return '—'; const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); const days = '일월화수목금토'; return `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]})` + (withTime ? ` ${p(d.getHours())}:${p(d.getMinutes())}` : ''); };
const ago = (iso) => { if (!iso) return '—'; const s = (Date.now() - new Date(iso)) / 1000; if (s < 60) return '방금'; if (s < 3600) return `${Math.floor(s / 60)}분 전`; if (s < 86400) return `${Math.floor(s / 3600)}시간 전`; return `${Math.floor(s / 86400)}일 전`; };
const until = (iso) => { if (!iso) return ''; const s = (new Date(iso) - Date.now()) / 1000; if (s < 3600) return `${Math.max(1, Math.round(s / 60))}분 후`; if (s < 86400) return `${Math.round(s / 3600)}시간 후`; return `${Math.round(s / 86400)}일 후`; };
const resultPill = (r) => ({ ok: '<span class="pill ok">성공</span>', fail: '<span class="pill bad">실패</span>', running: '<span class="pill info"><span class="dot run"></span>실행 중</span>', unknown: '<span class="pill">기록 확인</span>', info: '<span class="pill">기타</span>' }[r] || '');

// ---- 데이터 해석
// 결재함 모델: 요청서(approvals.json) + 변경안(PR·브랜치) + 요청서가 아직 없는 백로그 [승인] 줄
function inboxModel() {
  const reqs = (D?.approvals || []).filter((a) => a.status !== 'done');
  const waiting = reqs.filter((a) => !a.my), decided = reqs.filter((a) => a.my);
  const done = (D?.approvals || []).filter((a) => a.status === 'done');
  const prs = S?.github?.prs || [];
  const branches = (D?.pending || []).filter((b) => !prs.some((p) => p.branch === b.name));
  const legacy = approvals().filter((x) => x.kind === '승인');
  return { waiting, decided, done, prs, branches, legacy, count: waiting.length + prs.length + branches.length + legacy.length };
}
function approvals() {
  const items = [];
  for (const line of (D?.backlog || '').split('\n')) {
    const m = line.match(/^\s*[-*]\s*\[(승인|auto)\]\s*(.+)$/);
    if (m) items.push({ kind: m[1], text: m[2].trim() });
  }
  return items;
}
function money() {
  const rows = D?.ledger?.rows || [];
  const month = new Date().toISOString().slice(0, 7);
  const isExp = (r) => /지출|비용|expense|cost|fee|수수료/i.test(r.type || '');
  const isRecv = (r) => /^(y|yes|o|true|1|완료|입금|✓|received)$/i.test((r.received || '').trim());
  const sum = (arr) => { const by = {}; for (const r of arr) { const a = parseFloat(String(r.amount).replace(/[^\d.\-]/g, '')) || 0; const c = (r.currency || 'KRW').toUpperCase(); by[c] = (by[c] || 0) + (isExp(r) ? -a : a); } return by; };
  return {
    month: sum(rows.filter((r) => (r.month || '').startsWith(month) && !isExp(r))),
    all: sum(rows.filter((r) => !isExp(r))),
    unpaid: sum(rows.filter((r) => !isExp(r) && !isRecv(r))),
    exp: sum(rows.filter(isExp).map((r) => ({ ...r, type: '' }))),
    count: rows.length, isRecv, isExp,
  };
}
const fmtMoney = (by) => { const ks = Object.keys(by); if (!ks.length) return '0원'; return ks.map((c) => { const v = Math.round(by[c] * 100) / 100; return c === 'KRW' ? `${v.toLocaleString('ko-KR')}원` : `${c} ${v.toLocaleString('en-US')}`; }).join(' · '); };
const CLOSED = /종료|거절|중단|lost|closed|declined|dead/i, WON = /계약|성사|won|signed|진행 중 광고/i;
function pipeStats() {
  const rows = D?.pipeline?.rows || [];
  const by = {}; for (const r of rows) { const s = r.stage || '미분류'; by[s] = (by[s] || 0) + 1; }
  const today = new Date().toISOString().slice(0, 10);
  return { rows, by, open: rows.filter((r) => !CLOSED.test(r.stage || '')).length, due: rows.filter((r) => r.next_action_date && r.next_action_date <= today && !CLOSED.test(r.stage || '')), today };
}
function overall() {
  if (!S) return { cls: '', text: '연결 중…' };
  const t = S.tools, rs = Object.values(S.routines);
  if (!S.repo.ok || !S.runner) return { cls: 'bad', text: '에이전트가 아직 설치되지 않았습니다', fix: true };
  if (!t.claude) return { cls: 'bad', text: 'Claude Code(claude)를 찾을 수 없습니다 — 설치·로그인이 필요합니다' };
  if (rs.some((r) => r.running)) return { cls: 'ok', text: `에이전트 작업 중 — ${rs.filter((r) => r.running).map((r) => r.name).join(', ')}`, run: true };
  const bad = Object.entries(S.routines).find(([, r]) => r.last?.result === 'fail');
  if (bad) { const [k, r] = bad; const p = r.last.problem; return { cls: 'bad', text: `${r.name} 실패 — ${p?.title || '원인 확인 필요'}`, cause: p?.id === 'unknown' ? p.cause : '', detail: p ? p.fix : '', action: p?.action, routine: k, log: r.last.file }; }
  if (S.sync?.ok && S.sync.pushOk === false) return { cls: 'warn', text: 'GitHub 에 올릴 권한이 없습니다 — 에이전트의 작업이 이 맥에만 남습니다', action: 'gh-login' };
  if (!rs.some((r) => r.scheduled)) return { cls: 'warn', text: '자동 실행이 꺼져 있습니다 (지금 실행은 가능)', sched: true };
  return { cls: 'ok', text: '정상 운영 중 — 자동 실행 켜짐' };
}

    <div class="desc">${esc(r.desc)}</div>

    <dt>마지막</dt><dd>${last ? `${ago(last.at)} ${resultPill(last.result)}` : '<span class="muted">아직 없음</span>'}</dd>
    ${last?.problem ? `<dt>원인</dt><dd style="color:var(--bad)">${esc(last.problem.title)}</dd>` : ''}</dl>
    <div class="acts">${r.running ? `<button class="btn sm danger" data-stop="${k}">멈추기</button><button class="btn sm" data-page-go="runs">진행 보기</button>` : `<button class="btn sm pri" data-run="${k}">지금 실행</button>${last ? `<button class="btn sm" data-log="${esc(last.file)}">기록</button>` : ''}`}</div></div>`;
}
function srcNote() {
  if (!D?.source || D.source.isMain) return '';
  return `<p class="muted" style="font-size:12px;margin-top:10px">최신 기준: 결재 대기 중인 변경안 <b>${esc(D.source.name)}</b> (${fmtDate(D.source.date)}). 병합 전 내용입니다.</p>`;
}
function title(p) { return p.replace(/^reports\//, '').replace(/\.md$/, '').replace(/^drafts\//, '').replace(/[-_]/g, ' '); }

// 간단한 마크다운 → HTML (먼저 이스케이프)
function md(src) {
  const lines = esc(src).split('\n'); let out = '', list = null, inCode = false, tbl = [];
  const inline = (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushList = () => { if (list) { out += `</${list}>`; list = null; } };
  const flushTbl = () => { if (tbl.length) { const rows = tbl.filter((r) => !/^\|?\s*:?-{2,}/.test(r)).map((r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))); out += `<div class="tbl-wrap"><table><thead><tr>${rows[0].map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; tbl = []; } };
  for (const l of lines) {
    if (l.startsWith('```')) { flushList(); flushTbl(); out += inCode ? '</pre>' : '<pre>'; inCode = !inCode; continue; }
    if (inCode) { out += l + '\n'; continue; }
    if (/^\s*\|/.test(l)) { flushList(); tbl.push(l.trim()); continue; } else flushTbl();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flushList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { flushList(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { flushList(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) { flushList(); }
    else { flushList(); out += `<p>${inline(l)}</p>`; }
  }
  flushList(); flushTbl(); if (inCode) out += '</pre>';
  return out;
}

async function loadReport() {
  const el = $('#doc'); if (!el || !sel.report) return;
  const r = await api(`/api/report?path=${encodeURIComponent(sel.report.path)}&ref=${encodeURIComponent(sel.report.ref)}`);
  el.innerHTML = r.ok ? md(r.text) || '<div class="empty">빈 문서</div>' : '<div class="empty">열 수 없습니다</div>';
}
async function loadLogs() {
  const el = $('#loglist'); if (!el) return;
  const r = await api('/api/logs');
  const name = (f) => { const m = f.match(/^routine-([ABCDX])-(\d{4}-\d\d-\d\d)_(\d\d)(\d\d)/); return m ? `${m[1] === 'X' ? '직접 명령' : S?.routines?.[m[1]]?.name || m[1]} · ${m[2].slice(5).replace('-', '/')} ${m[3]}:${m[4]}` : f; };
  if (!sel.log && r.list[0]) sel.log = r.list[0].file;
  el.innerHTML = r.list.length ? `<ul class="list">${r.list.map((x) => `<li class="pick ${sel.log === x.file ? 'on' : ''}" data-log="${esc(x.file)}"><div class="t">${esc(name(x.file))}<div class="m">${ago(x.at)} · ${Math.max(1, Math.round(x.size / 1024))}KB</div></div>${resultPill(x.result)}</li>`).join('')}</ul>` : '<div class="empty">아직 실행 기록이 없습니다</div>';
  if (sel.log) { const v = await api(`/api/log?file=${encodeURIComponent(sel.log)}`); const pre = $('#logview'); sel.logRoutine = (sel.log.match(/^routine-([ABCD])-/) || [])[1] || null; const dv = $('#diagview'); if (dv && v.ok) dv.innerHTML = diagCard(v.diag); if (pre && v.ok) { const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30; pre.textContent = (v.truncated ? '… (앞부분 생략)\n' : '') + (v.text || '(아직 출력 없음 — 에이전트가 작업을 끝내면 결과가 한 번에 기록됩니다)'); if (atEnd) pre.scrollTop = pre.scrollHeight; } }
}

const openAp = new Set(); let apTouched = false; const memos = {};
document.addEventListener('toggle', (e) => { const d = e.target; if (!d.matches?.('details.ap[data-ap]')) return; apTouched = true; d.open ? openAp.add(d.dataset.ap) : openAp.delete(d.dataset.ap); }, true);
document.addEventListener('input', (e) => { const k = e.target.dataset?.memo; if (k) memos[k] = e.target.value; });
function render() {
  document.querySelectorAll('.nav').forEach((b) => b.classList.toggle('on', b.dataset.page === page));
  $('#main').innerHTML = S ? PAGES[page]() : '<div class="empty" style="padding:80px">운영센터 불러오는 중…</div>';
  document.querySelectorAll('[data-memo]').forEach((el) => { if (memos[el.dataset.memo]) el.value = memos[el.dataset.memo]; }); // 다시 그려도 적던 메모 유지
  if (page === 'reports') loadReport();
  if (page === 'runs') loadLogs();
  const n = inboxModel().count;
  const b = $('#b-approve'); b.hidden = !n; b.textContent = n;
  const ci = C.cloud.filter((c) => c.state === 'open').length + C.local.filter((c) => c.state === 'running').length; const bc = $('#b-command'); bc.hidden = !ci; bc.textContent = ci;
  const fi = D?.inbox?.items?.length || 0; const bi = $('#b-improve'); bi.hidden = !fi; bi.textContent = fi;
  const o = overall(); $('#side-foot').innerHTML = `<span class="dot ${o.run ? 'run' : o.cls}"></span>${esc(o.cls === 'ok' ? (o.run ? '작업 중' : '정상') : o.cls === 'warn' ? '확인 필요' : o.cls === 'bad' ? (o.fix ? '설치 필요' : '조치 필요') : '연결 중')}<br><span style="opacity:.7">GitHub ${S?.sync?.at ? ago(S.sync.at) + ' 동기화' : '동기화 중'}${S?.repo?.hash ? `<br>버전 ${esc(S.repo.hash)} · 자동 업데이트` : ''}</span>`;
}

let lastState = 0, lastSig = '', uiSeen = null;
async function refresh(force) {
  try {
    S = await api('/api/status');
    // 운영센터가 스스로 새 버전으로 바뀌었으면 화면도 새로 연다 (무언가 적는 중이면 기다린다)
    if (S.ui) { if (uiSeen === null) uiSeen = S.ui; else if (S.ui !== uiSeen && !['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement?.tagName) && !Object.values(memos).some((v) => v)) { location.reload(); return; } }
    if (force || Date.now() - lastState > 30000) { D = await api('/api/state'); lastState = Date.now(); }
    if (force || page === 'command' || !C.synced) { try { const c = await api('/api/commands'); if (c.ok) C = c; } catch {} }
    const sig = JSON.stringify([S.routines, S.repo, S.tools, D?.reports?.length, D?.pending?.length, D?.source, D?.inbox, D?.feedback?.rows?.length, S.sync?.at, S.sync?.msg, S.sync?.pushOk, S.github?.at, S.update, D?.approvals, C.cloud.map((c) => [c.number, c.state, c.reply?.at]), C.local.map((c) => [c.file, c.state])]);
    if (document.activeElement && ['TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) && !force) { lastSig = lastSig || sig; return; } // 입력 중에는 화면을 다시 그리지 않는다
    if (force || sig !== lastSig) { lastSig = sig; render(); }
    else if (page === 'runs' && Object.values(S.routines).some((r) => r.running)) loadLogs();
  } catch { $('#side-foot').innerHTML = '<span class="dot bad"></span>서버 연결 끊김'; }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, .pick'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (t.tagName === 'SUMMARY') return;
  if (d.page || d.pageGo) { page = d.page || d.pageGo; try { localStorage.setItem('sc-page', page); } catch {} render(); return; }
  if (d.run) return act('/api/run', { routine: d.run }, t);
  if (d.stop) return act('/api/stop', { routine: d.stop }, t);
  if (d.sched) return act('/api/schedule', { on: d.sched === '1' }, t);
  if (d.open) return act('/api/open', { target: d.open }, t);
  if (d.branch) return act('/api/open', { target: 'branch', arg: d.branch }, t);
  if (d.report) { sel.report = { path: d.report, ref: d.ref }; if (page !== 'reports') { page = 'reports'; render(); } else { document.querySelectorAll('[data-report]').forEach((x) => x.classList.toggle('on', x === t)); loadReport(); } return; }
  if (d.log) { sel.log = d.log; if (page !== 'runs') { page = 'runs'; render(); } else loadLogs(); return; }
  if (d.act === 'fb-add') { const text = $('#fb-text').value, source = $('#fb-src').value; if (!text.trim()) return toast('내용을 적어 주세요'); return act('/api/feedback', { source, text }, t); }
  if (d.fbDel) return act('/api/feedback/remove', { index: Number(d.fbDel) }, t);
  if (d.copylog !== undefined) {
    const f = d.copylog || sel.log; if (!f) return toast('복사할 기록이 없습니다');
    return api(`/api/log?file=${encodeURIComponent(f)}`).then(async (v) => {
      const text = `[싹싹 클린 운영센터 실행 기록 ${f}]\n${(v.text || '').slice(-6000)}`;
      try { await navigator.clipboard.writeText(text); toast('기록을 복사했습니다 — Claude 대화창에 붙여 넣어 주세요'); }
      catch { page = 'runs'; sel.log = f; render(); toast('자동 복사가 막혀 있습니다 — 아래 기록을 직접 선택해 복사해 주세요'); }
    });
  }
  if (d.url) return act('/api/open', { target: 'url', arg: d.url }, t);
  if (d.quick) { const ta = $('#cmd-text'); ta.value = d.quick; memos.cmd = d.quick; ta.focus(); return; }
  if (d.cmd) {
    const text = $('#cmd-text').value;
    if (!text.trim()) return toast('명령을 적어 주세요');
    return act('/api/command', { text, where: d.cmd }, t).then((r) => { if (r?.ok) { delete memos.cmd; const ta = $('#cmd-text'); if (ta) ta.value = ''; } });
  }
  if (d.ext) return act('/api/open', { target: 'ext', arg: d.ext }, t);
  if (d.apGo) { apTouched = true; openAp.clear(); openAp.add(d.apGo); page = 'approve'; render(); document.querySelector(`[data-ap="${CSS.escape(d.apGo)}"]`)?.scrollIntoView({ block: 'start' }); return; }
  if (d.decide) {
    const memo = document.querySelector(`[data-memo="${CSS.escape(d.decide)}"]`)?.value || '';
    const a = (D?.approvals || []).find((x) => x.id === d.decide);
    if (d.decision === 'done' && a?.ask && !memo.trim() && !t.dataset.sure) { t.dataset.sure = '1'; t.textContent = '메모 없이 완료 처리할까요? 한 번 더 누르면 완료'; return; }
    sel.ap = null; delete memos[d.decide];
    return act('/api/decide', { id: d.decide, decision: d.decision, label: d.label, memo, title: a?.title || '' }, t);
  }
  if (d.undecide) return act('/api/undecide', { id: d.undecide }, t);
  if (d.pr) {
    const memo = document.querySelector(`[data-memo="pr-${d.pr}"]`)?.value || '';
    if (d.prAct === 'close' && !memo.trim()) return toast('반려 이유를 적어 주세요 — 에이전트가 읽고 고칩니다');
    if (!t.dataset.sure) { t.dataset.sure = '1'; t.textContent = d.prAct === 'merge' ? '정말 승인할까요? 한 번 더 누르면 병합' : '정말 반려할까요? 한 번 더 누르면 반려'; return; }
    toast('GitHub 에 처리 중…');
    return act('/api/pr', { number: Number(d.pr), action: d.prAct, memo }, t);
  }
  if (d.act === 'login') return act('/api/login', {}, t);
  if (d.act === 'gh-login') return act('/api/gh-login', {}, t);
  if (d.act === 'pull') { toast('GitHub 와 동기화 중…'); return act('/api/pull', {}, t); }
  if (d.act === 'install') { toast('설치 중… 1~2분 걸릴 수 있습니다'); return act('/api/install', {}, t); }
  if (d.act === 'quit') { api('/api/quit', {}).finally(() => { document.body.innerHTML = '<div class="empty" style="padding:80px">운영센터를 종료했습니다. 이 창을 닫아도 됩니다.<br>예약된 자동 실행은 계속 동작합니다.</div>'; }); }
});

refresh(true);
setInterval(() => refresh(false), 5000);
</script>
